# Entorno local de Aprendizaje USCO.
#
#   docker compose up -d --build              → backend + PostgreSQL + pgAdmin
#   docker compose up -d postgres pgadmin     → solo base y pgAdmin (backend con mvnw)
#   docker compose stop                       → detener sin borrar datos
#
# Los puertos se publican solo en 127.0.0.1: accesibles desde tu equipo,
# no desde otros dispositivos de la red (pgAdmin no pide login).


services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${SPRING_DATASOURCE_DB}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


# Cliente web de PostgreSQL: http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - '127.0.0.1:5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      # Spring Boot (spring-boot-docker-compose) no intenta conectarse ni esperar a este servicio.
      org.springframework.boot.ignore: 'true'


# Backend en Docker. Si vas a correr el backend con mvnw, levanta solo
# `docker compose up -d postgres pgadmin` para no ocupar el puerto 8080.
  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${SPRING_DATASOURCE_DB}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      # Perfil dev = migraciones + usuarios de prueba. En staging/producción se define otro valor.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - '127.0.0.1:8080:8080'

volumes:
  pgadmin_data:

