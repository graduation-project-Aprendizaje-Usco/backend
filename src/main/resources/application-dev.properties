# Perfil "dev": SOLO desarrollo local (staging tendrá su propio perfil, sin llaves por defecto).
# Se activa solo con ./mvnw spring-boot:run (configurado en el pom.xml) o con
# SPRING_PROFILES_ACTIVE=dev. Las pruebas automáticas NO lo usan.

# Además de las migraciones normales, carga los usuarios de prueba (db/dev-data).
spring.flyway.locations=classpath:db/migration,classpath:db/dev-data

# SQL en consola para depurar (desactivarlo si molesta).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Llave JWT de desarrollo. Pública a propósito (está en el repositorio): solo sirve
# en local. Si defines JWT_SECRET (en .env o en el sistema), se usa esa.
app.jwt.secret=${JWT_SECRET:solo-desarrollo-local-no-usar-en-staging-2026}
