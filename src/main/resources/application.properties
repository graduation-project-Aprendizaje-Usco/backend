spring.application.name=aprendizaje-usco-backend


# --- Base de datos ---------------------------------------------------------
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


# El esquema lo crea y versiona SOLO Flyway (src/main/resources/db/migration).
# Hibernate únicamente valida que las entidades coincidan con las tablas.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# Si una base de desarrollo (con usuarios de prueba de db/dev-data) se arranca sin el
# perfil dev, Flyway no debe fallar por no encontrar esa migración repetible.
# Solo se ignoran repetibles faltantes; una versionada faltante sigue siendo error.
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing
spring.jpa.hibernate.ddl-auto=validate


# Sin consultas a la base desde las vistas/serialización: cada servicio carga lo que necesita.
spring.jpa.open-in-view=false

# --- JWT -------------------------------------------------------------------
# Llave para firmar los tokens (HS256, mínimo 32 caracteres). SIN valor por defecto:
# fuera del perfil dev, si falta la variable JWT_SECRET la app NO arranca (JwtProperties).
# Así un staging o producción mal configurado nunca firma con una llave conocida.
# En desarrollo la pone application-dev.properties y en las pruebas
# src/test/resources/config/application.properties.
app.jwt.secret=${JWT_SECRET:}
# Duración del token en minutos (120 = 2 horas).
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# --- CORS ------------------------------------------------------------------
# Orígenes del frontend que pueden llamar a la API (varios separados por coma).
# En desarrollo no hace falta definir CORS_ORIGINS; en staging se define en el hosting.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
