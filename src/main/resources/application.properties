spring.application.name=aprendizaje-usco-backend

# Local values can be supplied through the untracked .env file. Hosted
# environments provide the same settings through their environment variables.
spring.config.import=optional:file:.env[.properties]

# --- Base de datos ---------------------------------------------------------
# Neon requires sslmode=require in SPRING_DATASOURCE_URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/aprendizaje_usco}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}


# El esquema lo crea y versiona SOLO Flyway (src/main/resources/db/migration).
# Hibernate únicamente valida que las entidades coincidan con las tablas.
spring.flyway.enabled=true
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
# Flyway solo avanza con migraciones versionadas; nunca limpia ni borra datos.
spring.flyway.clean-disabled=true


# Si una base local con usuarios de prueba se inicia sin db/dev-data, se ignora
# la migración repetible faltante; una versionada faltante sigue siendo error.
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}


# Sin consultas a la base desde las vistas/serialización: cada servicio carga lo que necesita.
spring.jpa.open-in-view=false

# --- Servidor --------------------------------------------------------------
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:true}

# --- Administrador inicial -----------------------------------------------
# Opcional. Si se configuran correo y contraseña, crea el usuario solo si falta.
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.nombres=${BOOTSTRAP_ADMIN_NAMES:Administrador}
app.bootstrap-admin.apellidos=${BOOTSTRAP_ADMIN_SURNAMES:Sistema}

# --- JWT -------------------------------------------------------------------
# Llave para firmar los tokens (HS256, mínimo 32 caracteres). SIN valor por defecto:
# si falta JWT_SECRET, la app NO arranca. Las pruebas tienen una llave aislada en
# src/test/resources/config/application.properties.
app.jwt.secret=${JWT_SECRET:}
# Duración del token en minutos (120 = 2 horas).
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# --- CORS ------------------------------------------------------------------
# Orígenes del frontend que pueden llamar a la API (varios separados por coma).
# CORS_ORIGINS permite varios; FRONTEND_URL sirve como alternativa para un único origen.
app.cors.allowed-origins=${CORS_ORIGINS:${FRONTEND_URL:http://localhost:5173},https://www.aprendizaje-usco.tech}

# --- Prueba diagnóstica ----------------------------------------------------
# Segundos de tolerancia para aceptar una respuesta que llega justo después de
# que se acaba el tiempo (latencia de red). Pasada la tolerancia se rechaza (422).
app.diagnostico.gracia-segundos=5
# Barrido que finaliza por tiempo los intentos abandonados (BarridoIntentosVencidos).
app.diagnostico.barrido.habilitado=true
app.diagnostico.barrido.intervalo-ms=60000

# Umbrales de categorización (instrumento v2.0). Se cambian aquí sin tocar código;
# afectan a los intentos que se finalicen después del cambio (la categoría se guarda
# al finalizar). Cada escala se divide en: 0..maximo-alto-riesgo, ..maximo-riesgo-moderado, resto.
# Global (0 a 24):        0-9 alto riesgo, 10-16 riesgo moderado, 17-24 nivel adecuado.
app.diagnostico.umbrales.global.escala=24
app.diagnostico.umbrales.global.maximo-alto-riesgo=9
app.diagnostico.umbrales.global.maximo-riesgo-moderado=16
# Por competencia (0 a 8): 0-3 bajo, 4-6 medio, 7-8 alto.
app.diagnostico.umbrales.dimension.escala=8
app.diagnostico.umbrales.dimension.maximo-alto-riesgo=3
app.diagnostico.umbrales.dimension.maximo-riesgo-moderado=6

# --- Correo transaccional mediante Resend API -------------------------------
# La clave solo se proporciona por variable de entorno; nunca se configura aquí.
app.resend.api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:Aprendizaje USCO <noreply@aprendizaje-usco.tech>}

# --- Registro por invitación ------------------------------------------------
# En desarrollo, staging y producción el registro público está cerrado: solo se
# crea cuenta con un token de invitación válido. Las pruebas automáticas lo abren
# en src/test/resources/config/application.properties para no romper sus fixtures.
app.registro.invitacion-obligatoria=true
app.invitaciones.vigencia-dias=7
app.invitaciones.url-base=${FRONTEND_URL:http://localhost:5173}/registro

# --- Configuración inicial de contraseña ------------------------------------
# El enlace enviado a cuentas creadas por ADMIN vence en 7 días; su origen se
# deriva de FRONTEND_URL para soportar localhost y el dominio desplegado.
app.activacion-cuenta.vigencia-horas=168
app.activacion-cuenta.url-base=${FRONTEND_URL:http://localhost:5173}/activar-cuenta

# --- Practica adaptativa ---------------------------------------------------
# Asignaturas que acepta el motor. Los temas no se limitan aqui: son texto del contenido.
app.practica.asignaturas=CALCULO_DIFERENCIAL,CALCULO_INTEGRAL

# Solo el primer intento de cada ejercicio cuenta para la racha y el nivel.
app.practica.niveles.aciertos-para-subir=3
app.practica.niveles.errores-para-bajar=3
app.practica.niveles.nivel-inicial-sin-diagnostico=1
