# Configuración extra SOLO para las pruebas automáticas (mvnw test / CI).
#
# Spring Boot carga classpath:/application.properties (el de src/main) y ADEMÁS
# classpath:/config/application.properties (este archivo), que tiene prioridad.
# Por eso aquí solo va lo que las pruebas necesitan distinto, sin tocar src/main.
spring.docker.compose.enabled=false
spring.flyway.locations=classpath:db/migration

# Llave JWT de pruebas (en src/main/application.properties no hay valor por defecto).
app.jwt.secret=llave-solo-para-pruebas-automaticas-2026-no-usar

# Las pruebas existentes registran estudiantes sin invitación; las pruebas nuevas
# de #150 activan la obligatoriedad con @SpringBootTest(properties = ...).
app.registro.invitacion-obligatoria=false

# El barrido programado de intentos vencidos se apaga en las pruebas para que no
# finalice intentos mientras una prueba los está usando; BarridoIntentosVencidosTest
# lo crea y lo invoca a mano.
app.diagnostico.barrido.habilitado=false
